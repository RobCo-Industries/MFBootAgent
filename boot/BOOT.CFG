# /ROBCO/BOOT.CFG, the boot settings of the terminal chain.
# [boot] and [entry NAME] are read by MFBootAgent. See docs/BOOT.md.
[boot]
default = UOS
timeout = 3

[entry UOS]
path = /ROBCO/UOS.SYS
cmdline =

[entry MAINT]
path = /ROBCO/MAINT.SYS

[entry DIAG]
path = /ROBCO/DIAG.SYS

# Read by RETROS-BIOS, ignored by MFBootAgent. These are the BIOS defaults.
[bios]
delay_ms = 1000
beep = on
scheme = green
